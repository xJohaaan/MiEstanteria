spring.application.name=mi-estanteria-backend
# Configuracion local de cada integrante (contrasena de MySQL, etc.). Este archivo NO se sube a git.
# Se acepta en backend/local.properties o en el local.properties de la raiz del proyecto Android.
spring.config.import=optional:file:../local.properties,optional:file:./local.properties
server.port=${PORT:8080}

# ---- Base de datos MySQL 8 ----
# En local usa la base mi_estanteria (se crea sola).
# En Railway se toman solas las variables del servicio MySQL (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD).
# Tambien se puede pasar la URL completa con DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:mi_estanteria}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.hikari.maximum-pool-size=5

# El esquema lo crean las migraciones versionadas de Flyway (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Seguridad ----
# Clave para firmar los JWT (minimo 32 caracteres). En produccion SIEMPRE se define JWT_SECRET.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-mi-estanteria-cambiar-en-produccion-2026}
# La sesion caduca a las 24 horas (RNF03)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---- Google Books ----
# La clave es opcional; sin ella la API funciona con un limite diario menor.
app.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
